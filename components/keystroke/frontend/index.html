<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<style>
  :root { --honey:#C2842A; --honey-dark:#A0681A; --ink:#2A2118; --paper:#FBF3E3; --line:rgba(42,33,24,.14); }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Noto Sans KR', system-ui, sans-serif; color:var(--ink); }
  .wrap { padding:2px; }
  textarea {
    width:100%; min-height:150px; resize:vertical; padding:12px 14px;
    border:1px solid var(--line); border-radius:14px; background:var(--paper);
    color:var(--ink); line-height:1.7; outline:none;
  }
  textarea:focus { border-color:var(--honey-dark); }
  .meta { display:flex; justify-content:space-between; align-items:center;
    font-size:11.5px; color:rgba(42,33,24,.55); margin:6px 2px 10px; font-family:'JetBrains Mono', monospace; }
  .rec-dot { display:inline-block; width:7px; height:7px; border-radius:50%;
    background:var(--honey); margin-right:5px; vertical-align:middle; }
  button.send {
    width:100%; padding:12px; border:none; border-radius:999px; cursor:pointer;
    background:var(--honey); color:#fff; font-weight:600; font-size:14px;
    box-shadow:0 6px 16px rgba(194,132,42,.25); transition:background .15s;
  }
  button.send:hover:not(:disabled) { background:var(--honey-dark); }
  button.send:disabled { background:#e6ddcc; color:#b3a58f; cursor:not-allowed; box-shadow:none; }
  .done { padding:16px; text-align:center; color:rgba(42,33,24,.6); font-size:13.5px;
    background:rgba(42,33,24,.04); border-radius:14px; }
  .hint { font-size:11px; color:rgba(42,33,24,.45); margin-top:8px; text-align:center;
    word-break:keep-all; overflow-wrap:normal; word-wrap:normal;
    -webkit-hyphens:none; hyphens:none; line-break:strict; white-space:normal;
    padding:0 4px; box-sizing:border-box; }
  .wf-label { font-size:10.5px; color:rgba(42,33,24,.5); font-family:'JetBrains Mono', monospace;
    letter-spacing:.04em; margin:2px 2px 2px; }
  .wf { width:100%; height:46px; display:block; margin-bottom:10px; }
</style>
</head>
<body>
  <div class="wrap" id="root"></div>

<script>
// ===== Streamlit 양방향 컴포넌트 브릿지 (빌드 불필요, postMessage 직접 구현) =====
function _send(type, data) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
}
function setFrameHeight(h) { _send("streamlit:setFrameHeight", { height: h }); }
function setComponentValue(v) { _send("streamlit:setComponentValue", { value: v }); }

let ARGS = {};
let bound = false;

window.addEventListener("message", function (e) {
  if (!e.data || e.data.type !== "streamlit:render") return;
  ARGS = e.data.args || {};
  render();
});
_send("streamlit:componentReady", { apiVersion: 1 });

// ===== 키 입력 캡처 상태 =====
const NON_PRINT = new Set([
  "ShiftLeft","ShiftRight","ControlLeft","ControlRight","AltLeft","AltRight",
  "MetaLeft","MetaRight","CapsLock","Tab","Escape","ArrowLeft","ArrowRight",
  "ArrowUp","ArrowDown","Home","End","PageUp","PageDown","Enter","NumpadEnter"
]);

let pending = {};       // code -> keydown time (ms, performance.now)
let strokes = [];       // {down, up} in ms, printable keys only
let downSeq = [];       // 연속 keydown 시각 (ms) - 리듬 휴리스틱용
let backspaceCount = 0;
let lastNonce = null;

function resetCapture() {
  pending = {}; strokes = []; downSeq = []; backspaceCount = 0;
}

// ===== 통계 유틸 =====
function mean(a){ return a.length ? a.reduce((s,x)=>s+x,0)/a.length : 0; }
function median(a){
  if(!a.length) return 0;
  const b=[...a].sort((x,y)=>x-y), m=Math.floor(b.length/2);
  return b.length%2 ? b[m] : (b[m-1]+b[m])/2;
}
function std(a){ // 표본 std (ddof=1) — pandas.std 기본과 동일
  if(a.length<2) return 0;
  const m=mean(a);
  return Math.sqrt(a.reduce((s,x)=>s+(x-m)*(x-m),0)/(a.length-1));
}
// numpy.percentile(선형보간)과 동일한 p 분위수
function percentile(a, p){
  if(!a.length) return 0;
  const b=[...a].sort((x,y)=>x-y);
  const idx=(b.length-1)*(p/100);
  const lo=Math.floor(idx), hi=Math.ceil(idx);
  if(lo===hi) return b[lo];
  return b[lo] + (b[hi]-b[lo])*(idx-lo);
}
// 왼손 키(QWERTY 왼쪽 글자) — train_model.py 와 반드시 동일
const LEFT_KEYS = new Set("qwertasdfgzxcvb".split(""));
// hold_time 정리 범위(초) — train_model.py 와 반드시 동일
const HOLD_LO = 0.03, HOLD_HI = 0.4;

// ===== 피처 계산 (모두 '초' 단위로 반환) =====
function computeFeatures() {
  const done = strokes.slice().sort((a,b)=>a.down-b.down);
  // ★ 요약은 파이썬(logic.py)이 학습과 동일한 코드로 수행한다.
  //   브라우저는 각 키의 누름시간(초)과 키 문자만 그대로 전달한다.
  //   (명백한 오류값 h<0 또는 h>=3초 만 1차 제거, 정밀 정리[0.03~0.4]는 파이썬)
  const raw_strokes = done
    .map(s => ({ h: (s.up - s.down)/1000, k: (s.key||"").toLowerCase() }))
    .filter(o => o.h >= 0 && o.h < 3);
  const holds_s = raw_strokes.map(o => o.h);   // 표시용 샘플 수 계산에만 사용
  const features = raw_strokes;                // ← logic.predict_parkinson 이 요약

  // 참고용 리듬 휴리스틱 (원본 computeLetterMetrics 방식, ms 기반)
  const intervals_ms = [];
  for (let i=1;i<downSeq.length;i++){
    const d = downSeq[i]-downSeq[i-1];
    if (d>0 && d<6000) intervals_ms.push(d);
  }
  const PAUSE=900;
  const active = intervals_ms.filter(d=>d<=PAUSE);
  const pauseCount = intervals_ms.filter(d=>d>PAUSE).length;
  const avg = mean(active);
  const cv = avg>0 ? std(active)/avg : 0;
  let cvNorm = (cv-0.15)/(0.75-0.15);
  cvNorm = Math.max(0, Math.min(1, cvNorm));
  let rhythm = 100 - cvNorm*70;
  rhythm -= Math.min(pauseCount*3, 15);
  const ta = document.getElementById("ta");
  const textLen = ta ? ta.value.length : 1;
  rhythm -= Math.min((backspaceCount/Math.max(textLen,1))*100, 15);
  rhythm = Math.round(Math.max(0, Math.min(100, rhythm)));

  return {
    features,
    rhythmScore: rhythm,
    rawRhythmScore: rhythm,
    cv: cv,
    avgInterval: avg,
    pauseCount: pauseCount,
    backspaceCount: backspaceCount,
    sampleSize: holds_s.length,
  };
}

// ===== 렌더 =====
function render() {
  const root = document.getElementById("root");
  const already = !!ARGS.already_done;

  // reset_nonce 바뀌면 캡처 초기화
  if (ARGS.reset_nonce !== lastNonce) { resetCapture(); lastNonce = ARGS.reset_nonce; }

  if (already) {
    root.innerHTML = '<div class="done">오늘의 편지를 이미 작성하셨어요. 내일 새로운 편지로 만나요!</div>';
    setFrameHeight(90);
    return;
  }

  root.innerHTML = ''
    + '<textarea id="ta" placeholder="편하게 답장을 적어보세요. (최소 80자 이상)"></textarea>'
    + '<div class="meta"><span><span class="rec-dot"></span>입력 리듬 기록 중</span>'
    +   '<span id="cnt">0자</span></div>'
    + '<div class="wf-label">RHYTHM WAVEFORM &middot; 실시간 입력 리듬</div>'
    + '<svg id="wf" class="wf" viewBox="0 0 300 46" preserveAspectRatio="none"></svg>'
    + '<button class="send" id="send" disabled>편지 보내기</button>'
    + '<div class="hint">내용은 저장되며, 분석은 입력 리듬만 사용합니다.</div>';

  const ta = document.getElementById("ta");
  const send = document.getElementById("send");
  const cnt = document.getElementById("cnt");

  function refresh() {
    cnt.textContent = ta.value.length + "자";
    send.disabled = ta.value.trim().length < 80;
  }

  function drawWaveform() {
    const svg = document.getElementById("wf");
    if (!svg) return;
    const W = 300, H = 46, pad = 4;
    const iv = [];
    for (let i = 1; i < downSeq.length; i++) {
      const d = downSeq[i] - downSeq[i - 1];
      if (d > 0 && d < 2000) iv.push(d);
    }
    const recent = iv.slice(-40);
    if (recent.length < 2) {
      svg.innerHTML = '<line x1="4" y1="23" x2="296" y2="23" stroke="rgba(42,33,24,.2)" '
        + 'stroke-width="1.5" stroke-dasharray="3,4"/>';
      return;
    }
    const mx = Math.max(Math.max.apply(null, recent), 200);
    const step = (W - pad * 2) / (recent.length - 1);
    let path = "";
    recent.forEach(function(v, i) {
      const x = pad + i * step;
      const y = H - pad - Math.max(0, Math.min(1, v / mx)) * (H - pad * 2);
      path += (i === 0 ? "M" : "L") + x.toFixed(1) + " " + y.toFixed(1) + " ";
    });
    svg.innerHTML = '<path d="' + path + '" fill="none" stroke="#A0681A" stroke-width="2" '
      + 'stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>';
  }

  ta.addEventListener("input", refresh);

  ta.addEventListener("keydown", function(ev){
    const t = performance.now();
    if (ev.code === "Backspace") { backspaceCount++; downSeq.push(t); drawWaveform(); return; }
    if (NON_PRINT.has(ev.code)) return;
    if (!(ev.code in pending)) { pending[ev.code] = { t: t, key: ev.key }; }  // 오토리핏 무시
    downSeq.push(t);
    drawWaveform();
  });

  ta.addEventListener("keyup", function(ev){
    const t = performance.now();
    if (ev.code in pending) {
      strokes.push({ down: pending[ev.code].t, up: t, key: pending[ev.code].key });
      delete pending[ev.code];
    }
  });

  send.addEventListener("click", function(){
    if (ta.value.trim().length < 80) return;
    const r = computeFeatures();
    r.submitId = Date.now();      // 제출마다 고유
    r.text = ta.value;
    setComponentValue(r);
    send.disabled = true;
    send.textContent = "분석 완료 · 저장 중…";
  });

  refresh();
  drawWaveform();
  setFrameHeight(320);
}
</script>
</body>
</html>
